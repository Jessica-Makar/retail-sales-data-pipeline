name: Python and dbt Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Python Data Quality Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  dbt-parse:
    name: dbt Project Parse
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.6 dbt-postgres==1.11.0

      - name: Create temporary dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          retail_sales_dbt:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci
                password: ci
                port: 5432
                dbname: retail_sales
                schema: analytics
                threads: 4
                sslmode: prefer
          EOF

      - name: Parse dbt project
        working-directory: retail_sales_dbt
        run: dbt parse