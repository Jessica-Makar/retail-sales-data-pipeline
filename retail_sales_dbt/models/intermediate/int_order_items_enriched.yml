version: 2

models:
  - name: int_order_items_enriched
    description: "Order items enriched with product and seller attributes."

    columns:
      - name: order_id
        description: "Order containing the item."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Item sequence number within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the order item."
        data_tests:
          - not_null

      - name: seller_id
        description: "Seller associated with the order item."
        data_tests:
          - not_null

      - name: price
        description: "Price of the order item."
        data_tests:
          - not_null

      - name: freight_value
        description: "Freight value associated with the order item."
        data_tests:
          - not_null